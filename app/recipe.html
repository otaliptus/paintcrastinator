  <main id="study" class="study wrap" hidden>
    <div class="study-heading">
      <h1 id="painting-title"></h1>
      <p id="artist-line" class="artist-line"></p>
    </div>

    <div class="studio-layout">
      <section class="workspace" aria-label="Painting">
        <div class="segmented" role="group" aria-label="Mode">
          <button id="watch-mode" class="mode-button active" type="button" aria-pressed="true">Watch</button>
          <button id="paint-mode" class="mode-button" type="button" aria-pressed="false">Paint</button>
        </div>

        <div id="canvas-frame" class="canvas-frame">
          <canvas id="painting-canvas" aria-label="Painting canvas"></canvas>
          <canvas id="guide-canvas" aria-hidden="true"></canvas>
          <div id="canvas-status" class="canvas-status"></div>
        </div>

        <div class="stage-caption">
          <strong id="stage-name"></strong>
          <span id="stroke-counter"></span>
        </div>
        <p id="stage-tip" class="stage-tip" hidden></p>

        <div id="watch-controls" class="controls">
          <div class="playback-row">
            <button id="play-button" class="primary-button" type="button">▶ Play</button>
            <input id="scrubber" class="scrubber" type="range" min="0" max="1" step="1" value="0" aria-label="Progress">
            <label class="speed-control" for="speed" title="Strokes per second"><input id="speed" type="range" min="10" max="500" step="10" value="10" aria-label="Speed"><output id="speed-output" for="speed"></output></label>
          </div>
          <div id="stage-buttons" class="stage-buttons" aria-label="Jump to a stage"></div>
        </div>

        <div id="paint-controls" class="controls" hidden>
          <div class="paint-actions">
            <span id="next-swatch" class="next-swatch" title="Colour of the next stroke" aria-hidden="true"></span>
            <span id="brush-size" class="brush-size"></span>
            <button id="zoom-toggle" class="quiet-button toggle" type="button" aria-pressed="true" title="Zoom in on small strokes">Zoom</button>
            <button id="steady-toggle" class="quiet-button toggle" type="button" aria-pressed="true" title="Pull your stroke onto the guide">Steady hand</button>
            <button id="undo-button" class="quiet-button" type="button">Undo</button>
            <button id="skip-button" class="quiet-button" type="button">Skip stage</button>
            <button id="restart-button" class="quiet-button" type="button">Restart</button>
          </div>
        </div>
      </section>

      <aside class="reference-panel" aria-label="Original">
        <img id="reference-image" alt="">
        <p id="reference-credit" class="reference-credit" hidden></p>
        <p id="study-description" class="study-description"></p>
      </aside>
